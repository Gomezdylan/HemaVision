services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app          # live-mount code so edits show up without rebuilding
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: project
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
