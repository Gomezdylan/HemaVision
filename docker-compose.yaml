services:
  app:
    build: .
    container_name: hemavision-dev
    ports:
      - "8000:8000"                 # for the results website (adjust to your framework)
    volumes:
      - .:/app                      # live code edits
      - ./data:/app/data            # blood smear images (NOT committed)
      - ./db:/app/db                # SQLite file lives here: db/hemavision.db
      - torch-cache:/root/.cache/torch   # cached ResNet-18 weights
    shm_size: "2gb"
    environment:
      - DB_PATH=/app/db/hemavision.db
  web:
    image: node:20
    container_name: hemavision-web
    working_dir: /web
    volumes:
      - .:/web
      - node-modules:/web/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  torch-cache:
  node-modules:
